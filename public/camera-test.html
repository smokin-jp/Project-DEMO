<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera test</title>
<style>
  body { font: 14px/1.5 system-ui, 'Segoe UI', sans-serif; background: #0d1117; color: #e8edf3; margin: 0; padding: 20px; max-width: 980px; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { color: #8b98a8; margin: 4px 0 14px; }
  button { font: inherit; color: #e8edf3; background: #1d6b4b; border: 1px solid #2a9d71; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
  button.sec { background: #1c2430; border-color: #2a3442; font-weight: 400; }
  .box { background: #151b24; border: 1px solid #2a3442; border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
  .ok { color: #34d399; } .bad { color: #ff8a95; } .warn { color: #fbbf24; } .dim { color: #8b98a8; }
  table { border-collapse: collapse; width: 100%; } td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid #2a3442; vertical-align: top; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .cam { background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #2a3442; }
  .cam video { width: 100%; display: block; background: #111; min-height: 140px; }
  .cam div { padding: 6px 8px; font-size: 12px; }
  code { background: #0d1117; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Camera test</h1>
<p>Checks, step by step, whether this browser can see and open your cameras. Nothing is recorded or sent anywhere.</p>

<div class="box" id="env"></div>
<button id="go">1. Allow camera access and list my cameras</button>
<button id="stop" class="sec">Stop all previews</button>

<div class="box" id="steps"><span class="dim">Press the button above.</span></div>
<div class="box"><b>Cameras the browser reports</b><table id="list"><tr><td class="dim">not listed yet</td></tr></table></div>
<div class="grid" id="grid"></div>
<p><a href="/" style="color:#7fb2ff">← back to the referee app</a></p>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const streams = [];
const steps = [];
const say = (cls, text) => { steps.push(`<div class="${cls}">${cls === 'ok' ? '✓' : cls === 'bad' ? '✗' : '•'} ${text}</div>`); $('#steps').innerHTML = steps.join(''); };

function browserName() {
  const u = navigator.userAgent;
  if (/Claude\//.test(u)) return 'the Claude desktop app’s built-in preview';
  if (navigator.brave) return 'Brave';
  if (/Edg\//.test(u)) return 'Edge';
  if (/Firefox\//.test(u)) return 'Firefox';
  if (/Chrome\//.test(u)) return 'Chrome';
  return 'an unknown browser';
}

async function env() {
  let perm = 'unknown';
  try { perm = (await navigator.permissions.query({ name: 'camera' })).state; } catch {}
  const embedded = /Claude\//.test(navigator.userAgent);
  $('#env').innerHTML =
    `Running in: <b>${esc(browserName())}</b><br>Address: <code>${esc(location.origin)}</code> (${isSecureContext ? '<span class="ok">secure context: cameras allowed</span>' : '<span class="bad">NOT a secure context: cameras are blocked here. Use http://localhost:5173</span>'})<br>` +
    `Camera permission for this site: <b class="${perm === 'granted' ? 'ok' : perm === 'denied' ? 'bad' : 'warn'}">${perm}</b>` +
    (embedded ? `<br><b class="bad">This is the Claude app’s built-in preview. It has no camera access. Open <code>${esc(location.origin)}/camera-test.html</code> in Brave, Chrome or Edge instead.</b>` : '') +
    (perm === 'denied' ? '<br><b class="bad">Blocked: click the lock / camera icon at the left of the address bar, set Camera to Allow, then reload.</b>' : '');
}

async function listDevices() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
  $('#list').innerHTML = devs.length
    ? '<tr><th>#</th><th>Name</th><th>Device id</th></tr>' + devs.map((d, i) => `<tr><td>${i + 1}</td><td>${d.label ? esc(d.label) : '<span class="warn">(hidden until access is allowed)</span>'}</td><td class="dim">${esc((d.deviceId || '(hidden)').slice(0, 14))}${d.deviceId.length > 14 ? '…' : ''}</td></tr>`).join('')
    : '<tr><td class="bad">No cameras reported by the browser.</td></tr>';
  return devs;
}

async function preview(d, i) {
  const card = document.createElement('div');
  card.className = 'cam';
  card.innerHTML = `<video autoplay muted playsinline></video><div>#${i + 1} ${esc(d.label || 'camera')}: <span class="st dim">opening…</span></div>`;
  $('#grid').appendChild(card);
  const st = card.querySelector('.st'), v = card.querySelector('video');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.deviceId } }, audio: false });
    streams.push(s);
    v.srcObject = s;
    await v.play();
    const t = s.getVideoTracks()[0].getSettings();
    st.className = 'st ok';
    st.textContent = `working ${t.width || v.videoWidth}x${t.height || v.videoHeight}`;
  } catch (e) {
    st.className = 'st bad';
    st.textContent = `${e.name}: ${e.name === 'NotReadableError' ? 'in use by another tab or app (close it)' : e.name === 'NotAllowedError' ? 'access blocked' : e.message}`;
  }
}

$('#go').onclick = async () => {
  steps.length = 0;
  $('#grid').innerHTML = '';
  streams.splice(0).forEach((s) => s.getTracks().forEach((t) => t.stop()));
  await env();
  if (!navigator.mediaDevices?.getUserMedia) { say('bad', 'This browser has no camera API (not a secure page?).'); return; }
  say('', 'Asking the browser for camera access… (allow it in the prompt that appears)');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    s.getTracks().forEach((t) => t.stop());
    say('ok', 'Camera access granted.');
  } catch (e) {
    say('bad', `Could not get camera access: <b>${esc(e.name)}</b> ${esc(e.message || '')}`);
    if (e.name === 'NotAllowedError') say('warn', 'Allow the camera in the address-bar icon (or Brave: brave://settings/content/camera), then press the button again.');
    if (e.name === 'NotFoundError') say('warn', 'No camera available to this browser. In the Claude app’s built-in preview this is expected: open the page in Brave/Chrome/Edge.');
    if (e.name === 'NotReadableError') say('warn', 'A camera is busy: another tab or program (Teams, Zoom, Camera app) is using it. Close it and try again.');
    await listDevices();
    await env();
    return;
  }
  const devs = await listDevices();
  await env();
  say(devs.length ? 'ok' : 'bad', `${devs.length} camera${devs.length === 1 ? '' : 's'} found.`);
  say('', 'Opening each camera separately to prove it works…');
  for (let i = 0; i < devs.length; i++) await preview(devs[i], i);
  say('ok', 'Done. A camera that shows “working” is usable in the referee app. Go back and choose it in a camera row.');
};
$('#stop').onclick = () => { streams.splice(0).forEach((s) => s.getTracks().forEach((t) => t.stop())); $('#grid').innerHTML = ''; };
env();
navigator.mediaDevices?.addEventListener?.('devicechange', () => listDevices());
</script>
</body>
</html>
